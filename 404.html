<!DOCTYPE html>
<html lang="cs">

<script>
// Google Analytics se spouští až po souhlasu s cookies (/cookies.js na konci stránky).

// Sdílené odesílání vlastních událostí do GA4 - no-op, dokud gtag
// neexistuje (např. návštěvník ještě neodsouhlasil cookies).
// Události GA4 (upraveno 9. 11. 2026): co se stane před souhlasem s cookies, se podrží
// jen v paměti stránky. Klikne-li člověk „Souhlasím“, odešle se to; při „Odmítnout“
// se to zahodí a nic se nikam nepošle. Bez souhlasu GA4 vůbec neběží.
window.trackTokvaEvent = function (eventName, parameters) {
  var data = Object.assign({}, parameters || {}, { page_path: window.location.pathname });
  if (typeof window.gtag === "function") { window.gtag("event", eventName, data); return; }
  var fronta = window.__tokvaFronta = window.__tokvaFronta || [];
  if (fronta.length < 50) fronta.push([eventName, data]);
  if (window.__tokvaHlidac) return;
  var kol = 0;
  window.__tokvaHlidac = setInterval(function () {
    kol++;
    var souhlas = null;
    try { souhlas = localStorage.getItem('cookies_souhlas'); } catch (e) {}
    var konec = function () { clearInterval(window.__tokvaHlidac); window.__tokvaHlidac = null; };
    if (souhlas === 'ne' || kol > 3600) { window.__tokvaFronta = []; konec(); return; }
    if (typeof window.gtag !== "function") return;
    var f = window.__tokvaFronta || [];
    window.__tokvaFronta = [];
    f.forEach(function (u) { window.gtag("event", u[0], u[1]); });
    konec();
  }, 1000);
};
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stránka nenalezena | Tokva</title>
<meta name="description" content="Tahle stránka na Tokvě neexistuje nebo se přesunula. Pokračujte na homepage nebo přímo k appkám.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #e9a91b; --gold-dark: #976e12; --gold-light: #fdf3d9;
  --black: #000000; --dark: #111111; --mid: #545454; --silver: #a8a6a6;
  --white: #ffffff; --paper: #fafaf8; --border: #e8e8e8;
  --border2: #e8e6e0; --border-strong: #e2e0da;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:'DM Sans',sans-serif; background:var(--paper); color:var(--dark); line-height:1.7; font-size:16px; }

.topbar { background:var(--black); color:var(--white); padding:14px 32px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--gold); flex-wrap:wrap; row-gap:8px; }
.topbar .brand { font-family:'Poppins',sans-serif; font-weight:800; font-size:15px; text-decoration:none; color:var(--white); }
.topbar .brand span { color:var(--gold); }

.main { padding:64px 24px 100px; max-width:640px; margin:0 auto; text-align:center; }
.kod { font-family:'Poppins',sans-serif; font-size:15px; font-weight:800; letter-spacing:3px; color:var(--gold-dark); margin-bottom:18px; }
h1 { font-family:'Poppins',sans-serif; font-size:clamp(26px,3.5vw,34px); font-weight:900; letter-spacing:-0.5px; margin-bottom:16px; line-height:1.25; }
.popis { font-size:15.5px; color:var(--mid); margin-bottom:8px; max-width:480px; margin-left:auto; margin-right:auto; }

.diagram { width:100%; max-width:280px; height:auto; margin:20px auto 4px; display:block; }
.diagram .cara { fill:none; stroke:var(--silver); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1000; stroke-dashoffset:1000; animation:kreslit-cestu 3s ease forwards; }
.diagram .sipka { fill:var(--gold); opacity:0; animation:objevit-sipku 0.3s ease forwards; animation-delay:2.75s; }
@keyframes kreslit-cestu { to { stroke-dashoffset:0; } }
@keyframes objevit-sipku { to { opacity:1; } }
@media (prefers-reduced-motion: reduce) {
  .diagram .cara { animation:none; stroke-dashoffset:0; }
  .diagram .sipka { animation:none; opacity:1; }
}

.pocitadlo-text { font-size:14.5px; color:var(--silver); margin-bottom:32px; }
.pocitadlo-text strong { color:var(--gold-dark); font-weight:700; }

.akce { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:56px; }
.btn { display:inline-flex; align-items:center; min-height:44px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; padding:13px 26px; border-radius:8px; text-decoration:none; }
.btn-gold { background:var(--gold); color:var(--black); }
.btn-gold:hover { background:var(--gold-dark); color:var(--white); }
.btn-outline { border:1px solid var(--border-strong); color:var(--dark); }
.btn-outline:hover { border-color:var(--gold-dark); color:var(--gold-dark); }

@media(max-width:600px){
  .topbar{padding:14px 16px;}
  .main{padding:48px 16px 80px;}
  .akce{flex-direction:column; align-items:stretch;}
  .akce .btn{justify-content:center;}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="https://tokva.cz/">Tokva</a>
</div>

<main class="main">
  <div class="kod">Chyba 404 · plýtvání hledáním</div>
  <h1>Tahle stránka tu není. Hledání je plýtvání.</h1>
  <p class="popis">Odkaz je starý nebo překlep. Než se ztratí další minuta, vyberte si, kam dál.</p>

  <svg class="diagram" viewBox="0 0 320 150" aria-hidden="true">
    <path class="cara" pathLength="1000" d="M20,120 C45,55 75,165 100,85 C115,35 60,10 68,55 C76,100 140,108 128,58 C118,10 182,0 192,46 C202,92 252,96 232,56 C218,26 262,16 282,42 L298,30" />
    <polygon class="sipka" points="298,22 298,38 316,30" />
  </svg>

  <p class="pocitadlo-text">Na hledání jste tu zatím strávili <strong id="pocitadlo">0:00</strong>.</p>

  <div class="akce">
    <a class="btn btn-gold" href="/nastroje/">Všechny appky</a>
    <a class="btn btn-outline" href="/nastroje/meric-plytvani-free/">Měřič plýtvání</a>
    <a class="btn btn-outline" href="/">Úvod Tokvy</a>
  </div>
</main>

<script>
(function(){
  var el = document.getElementById('pocitadlo');
  if (!el) return;
  var zacatek = Date.now();
  function tik() {
    var s = Math.floor((Date.now() - zacatek) / 1000);
    var m = Math.floor(s / 60);
    var ss = s % 60;
    el.textContent = m + ':' + (ss < 10 ? '0' : '') + ss;
  }
  setInterval(tik, 1000);
})();

window.trackTokvaEvent('stranka_404', { cesta: window.location.pathname });
</script>

<script src="/cookies.js"></script>
</body>
</html>
