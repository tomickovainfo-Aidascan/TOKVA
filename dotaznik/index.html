<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dotazník | Tokva</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e9a91b; --gold-dark:#c48e10; --gold-light:#fdf3d9;
  --black:#000; --dark:#111; --mid:#545454; --light:#7c7975;
  --white:#fff; --paper:#f5f4f0; --border:#e2e2e2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:"DM Sans",sans-serif;background:var(--paper);color:var(--dark);line-height:1.7;}

.cookies-bar{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:2px solid var(--gold);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;z-index:9999;font-family:"DM Sans",sans-serif;}
.cookies-bar p{font-size:13px;color:rgba(255,255,255,.85);line-height:1.5;margin:0;flex:1;min-width:200px;}
.cookies-bar a{color:var(--gold);text-decoration:none;}
.cookies-btns{display:flex;gap:8px;flex-shrink:0;}
.cookies-ok{background:var(--gold);color:#000;border:1.5px solid var(--gold);border-radius:6px;padding:9px 18px;font-size:13.5px;font-weight:700;cursor:pointer;}
.cookies-no{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6);border-radius:6px;padding:9px 18px;font-size:13.5px;font-weight:700;cursor:pointer;}
@media(max-width:600px){.cookies-bar p{flex:1 1 100%;font-size:12.5px;}.cookies-btns{width:100%;}.cookies-btns button{flex:1;}}

header{background:var(--black);padding:16px 20px;text-align:center;}
.brand{font-family:"Poppins",sans-serif;font-size:16px;font-weight:800;color:#fff;text-decoration:none;}
.brand span{color:var(--gold);}

.progress-nav{background:var(--white);border-bottom:1px solid var(--border);padding:14px 20px;}
.progress-nav-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.progress-nav-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-nav-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s ease;width:0%;}
.progress-nav-count{font-size:12px;color:var(--gold-dark);font-weight:700;white-space:nowrap;}

.main{max-width:560px;margin:0 auto;padding:28px 18px 70px;}

.uvod-text{font-size:14.5px;color:var(--mid);line-height:1.7;margin-bottom:18px;}

.otazka-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:24px 22px;}
.otazka-oddeleni{height:1px;background:var(--border);margin:22px 0;}
.otazka-text{font-family:"Poppins",sans-serif;font-size:clamp(16px,2.6vw,19px);font-weight:700;color:var(--black);line-height:1.35;margin-bottom:6px;}
.otazka-kontext{font-size:13px;color:var(--mid);line-height:1.6;margin-bottom:14px;font-style:italic;}

.moznosti{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.moznost{padding:13px 16px;border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;background:var(--paper);font-size:14.5px;color:var(--dark);}
.moznost:hover{border-color:var(--gold);background:var(--gold-light);}
.moznost.selected{border-color:var(--gold);background:var(--gold-light);font-weight:600;}

.pole-radek{display:flex;gap:8px;align-items:flex-start;margin-top:4px;}
.dotaznik-pole{flex:1;font:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--dark);}
textarea.dotaznik-pole{min-height:110px;resize:vertical;line-height:1.55;}
.dotaznik-pole:focus{outline:none;border-color:var(--gold);}
.btn-diktovat{flex-shrink:0;background:var(--white);border:1.5px solid var(--gold);color:var(--gold-dark);font-size:13px;font-weight:700;padding:10px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.btn-diktovat:hover{background:var(--gold-light);}
.btn-diktovat:disabled{opacity:.6;cursor:default;}

.otazka-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;}
.btn-zpet{background:transparent;border:1px solid var(--border);color:var(--mid);font-size:13.5px;font-weight:600;padding:12px 18px;border-radius:8px;cursor:pointer;}
.btn-zpet:hover{border-color:var(--mid);color:var(--dark);}
.btn-dal{background:var(--gold);color:var(--black);border:none;font-size:14.5px;font-weight:700;padding:13px 26px;border-radius:8px;cursor:pointer;margin-left:auto;}
.btn-dal:hover{background:var(--gold-dark);color:#fff;}
.btn-dal:disabled{background:var(--border);color:var(--light);cursor:default;}

.stav-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:32px 26px;text-align:center;}
.stav-card h2{font-family:"Poppins",sans-serif;font-size:19px;font-weight:800;color:var(--black);margin-bottom:10px;}
.stav-card p{font-size:14.5px;color:var(--mid);line-height:1.7;}

[hidden]{display:none !important;}

.notice-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.notice-box{background:var(--white);border:1px solid rgba(233,169,27,.3);border-radius:16px;padding:26px 22px 20px;width:100%;max-width:360px;text-align:center;}
.notice-text{font-size:14px;color:var(--dark);line-height:1.6;margin-bottom:18px;}
.notice-btn{background:var(--gold);color:var(--dark);border:none;border-radius:8px;padding:11px 26px;font-weight:700;font-size:13.5px;cursor:pointer;}
.notice-btn:hover{background:var(--gold-dark);color:#fff;}

footer{text-align:center;padding:20px;font-size:11.5px;color:var(--light);}
footer a{color:var(--light);text-decoration:none;}
</style>
</head>
<body>

<div class="cookies-bar" id="cookies-bar" style="display:none;">
  <p>Používám analytické cookies (Google Analytics) k měření návštěvnosti. <a href="https://tokva.cz/ochrana-osobnich-udaju/">Víc v zásadách</a></p>
  <div class="cookies-btns">
    <button class="cookies-no" onclick="cookiesOdmitnout()">Odmítnout</button>
    <button class="cookies-ok" onclick="cookiesSouhlasit()">Souhlasím</button>
  </div>
</div>

<header><a href="https://tokva.cz/" class="brand">Tokva<span>.</span></a></header>

<div class="progress-nav" id="progress-nav">
  <div class="progress-nav-inner">
    <div class="progress-nav-bar"><div class="progress-nav-fill" id="progress-fill"></div></div>
    <span class="progress-nav-count" id="progress-count">1 / 1</span>
  </div>
</div>

<div class="main">
  <div class="stav-card" id="stav-nacitani"><p>Načítám dotazník…</p></div>

  <div class="stav-card" id="stav-chyba" hidden>
    <h2>Tenhle odkaz nefunguje</h2>
    <p class="chyba-text"></p>
  </div>

  <p class="uvod-text" id="uvod-text" hidden></p>

  <div id="stav-otazky" hidden></div>

  <div class="stav-card" id="stav-dekovani" hidden>
    <h2>Děkuji</h2>
    <p class="dekovani-text"></p>
  </div>
</div>

<div class="notice-overlay" id="notice-overlay" hidden>
  <div class="notice-box">
    <p class="notice-text" id="notice-text"></p>
    <button class="notice-btn" id="notice-ok">Rozumím</button>
  </div>
</div>

<footer>tokva.cz &middot; <a href="https://tokva.cz/ochrana-osobnich-udaju/">Ochrana osobních údajů</a></footer>

<script>
function cookiesSouhlasit(){localStorage.setItem('cookies_souhlas','ano');document.getElementById('cookies-bar').style.display='none';spustitGA();}
function cookiesOdmitnout(){localStorage.setItem('cookies_souhlas','ne');document.getElementById('cookies-bar').style.display='none';}
function spustitGA(){
  if (window.__tokvaGA) return;
  window.__tokvaGA = true;
  var s=document.createElement('script');
  s.async=true;
  s.src='https://www.googletagmanager.com/gtag/js?id=G-NJWW5ZX4J9';
  document.head.appendChild(s);
  window.dataLayer=window.dataLayer||[];
  function gtag(){dataLayer.push(arguments);}
  window.gtag=gtag;
  gtag('js', new Date());
  gtag('config','G-NJWW5ZX4J9');
}
(function(){
  var s = localStorage.getItem('cookies_souhlas');
  if (s === 'ano') spustitGA();
  else if (s === null) document.getElementById('cookies-bar').style.display = 'flex';
})();
</script>

<script src="./app.js"></script>
</body>
</html>
